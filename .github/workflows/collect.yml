name: collect-delays

on:
  # Cron scharf seit 30.08.2026, 16:17 Uhr -- bewusst *jetzt* aktiviert statt zwei
  # einzelne manuelle Laeufe praezise auf Feierabend-/Berufsverkehr zu timen (dafuer
  # haette es eine externe Zeitsteuerung mit eigenem GitHub-Zugang gebraucht, unnoetiger
  # Umweg). GitHub Actions' eigener Scheduler deckt so oder so beide Fenster ab -- den
  # Sonntagabend, den Montag-Berufsverkehr ab 07:30 Uhr und alles dazwischen. Die ersten
  # ~18h Rohdaten (data/raw/2026-08-3{0,1}.jsonl) sind der eigentliche Health-Check:
  # zeigen die Verspaetungswerte unter echter Last plausible, von 0 abweichende Werte?
  # Siehe ERKLAERUNG.md fuer die Auswertung dazu, sobald verfuegbar.
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: uv run collect_delays.py
      - run: |
          git config user.name "collector-bot"
          git config user.email "actions@github.com"
          git add data/raw/
          git diff --staged --quiet || git commit -m "snapshot $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase
          git push
