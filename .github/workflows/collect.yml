name: collect-delays

on:
  # Ausprobiert 30.08.2026, 16:17 Uhr -- GitHubs eigener `schedule`-Trigger fuer
  # */5-Minuten-Takt ist nachweislich unzuverlaessig: in ~15h nur 5 von ~180
  # erwarteten Laeufen (siehe ERKLAERUNG.md, Abschnitt "Checkpoint 2"). Passt zu
  # GitHubs eigener Doku, dass sub-stuendliche schedule-Trigger bei Last verzoegert
  # oder ausgesetzt werden koennen -- kein Bug, sondern dokumentiertes Verhalten.
  # Deshalb bewusst NICHT mehr aktiv, nur als Referenz stehen gelassen:
  # schedule:
  #   - cron: "*/5 * * * *"
  #
  # Stattdessen: externer Zeitgeber (cron-job.org o.ae.) loest per repository_dispatch
  # aus, siehe ERKLAERUNG.md Abschnitt "Cron-Fix" fuer Setup.
  repository_dispatch:
    types: [collect-tick]
  workflow_dispatch:

concurrency:
  group: collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: uv run collect_delays.py
      - run: |
          git config user.name "collector-bot"
          git config user.email "actions@github.com"
          git add data/raw/
          git diff --staged --quiet || git commit -m "snapshot $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase
          git push
